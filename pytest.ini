[pytest]
testpaths = tests
# importlib mode prevents pytest from treating the repo root as a package via
# the plugin's __init__.py (which only imports cleanly inside Calibre).
addopts = --import-mode=importlib -m "not network"
markers =
    network: tests that hit the live Anna's Archive site (deselect with -m 'not network')
    unit: fast unit tests with no external dependencies
